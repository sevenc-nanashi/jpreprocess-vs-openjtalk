name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - uses: Swatinem/rust-cache@v2

      - name: Install OpenJTalk build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Run comparison and emit JSON
        run: cargo run --release -- --json-pages frontend/public ./data/*.txt > comparison.log

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 5.0.7

      - name: Build browser comparison
        run: bash scripts/build-wasm.sh

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          working-directory: "frontend"
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: vp install

      - name: Build frontend
        working-directory: frontend
        run: vp build

      - name: Include corpus attribution and licenses
        run: |
          cp data/CORPORA.md frontend/dist/CORPORA.md
          cp -r data/licenses frontend/dist/licenses

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deploy
        uses: actions/deploy-pages@v4
